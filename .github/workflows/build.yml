name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Structure and Patch Build Config
        run: |
          mkdir -p app/src/main/java
          
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi
          
          if [ -f "MainActivity.kt" ]; then
            PACKAGE_DIR=$(grep -oP 'package\s+\K[\w.]+' MainActivity.kt | tr '.' '/' || echo "com/datracker/app")
            mkdir -p "app/src/main/java/$PACKAGE_DIR"
            mv MainActivity.kt "app/src/main/java/$PACKAGE_DIR/"
          fi
          
          if [ -f "settings.gradle.kts" ] && ! grep -q "include" settings.gradle.kts; then
            echo "include(':app')" >> settings.gradle.kts
          fi
          
          if [ -f "build.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

          # Patch build.gradle.kts files to bypass missing version catalog (libs)
          for file in build.gradle.kts app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/alias(libs.plugins.android.application)/id("com.android.application")/g' "$file"
              sed -i 's/alias(libs.plugins.kotlin.android)/id("org.jetbrains.kotlin.android")/g' "$file"
              sed -i 's/alias(libs.plugins.kotlin.compose)/id("org.jetbrains.kotlin.plugin.compose")/g' "$file"
            fi
          done

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "--- Starting Gradle Build ---"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
