name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract and Locate Project
        run: |
          # Unzip the archive
          unzip -q *.zip -d source_code
          
          # Find the directory containing gradlew automatically
          PROJECT_DIR=$(dirname $(find source_code -name "gradlew" -print -quit))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
