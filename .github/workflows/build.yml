name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Structure Project and Build APK
        run: |
          mkdir -p app/src/main/java
          
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi
          
          if [ -f "MainActivity.kt" ]; then
            PACKAGE_DIR=$(grep -oP 'package\s+\K[\w.]+' MainActivity.kt | tr '.' '/' || echo "com/datracker/app")
            mkdir -p "app/src/main/java/$PACKAGE_DIR"
            mv MainActivity.kt "app/src/main/java/$PACKAGE_DIR/"
          fi
          
          if [ -f "settings.gradle.kts" ] && ! grep -q "include" settings.gradle.kts; then
            echo "include(':app')" >> settings.gradle.kts
          fi
          
          if [ -f "build.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Run gradle and capture output to print exact error if it fails
          gradle assembleDebug --console=plain || {
            echo "----------------------------------------"
            echo "BUILD FAILED. REPO FILE STRUCTURE:"
            find . -maxdepth 3
            echo "----------------------------------------"
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
