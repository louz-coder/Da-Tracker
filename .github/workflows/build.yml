name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Proper Android Project Structure
        run: |
          # 1. Create standard Android directory layout
          mkdir -p app/src/main/java/com/datracker/app
          mkdir -p app/src/main/res

          # 2. Move core files into their proper homes if they exist in root
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          if [ -f "MainActivity.kt" ]; then
            mv MainActivity.kt app/src/main/java/com/datracker/app/
            sed -i 's/^package .*/package com.datracker.app/g' app/src/main/java/com/datracker/app/MainActivity.kt
          fi

          # 3. Handle build.gradle.kts files
          if [ ! -f "app/build.gradle.kts" ] && [ -f "build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

          for f in build.gradle.kts app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/alias(libs.plugins.android.application)/id("com.android.application")/g' "$f"
              sed -i 's/alias(libs.plugins.kotlin.android)/id("org.jetbrains.kotlin.android")/g' "$f"
              sed -i 's/alias(libs.plugins.kotlin.compose)/id("org.jetbrains.kotlin.plugin.compose")/g' "$f"
            fi
          done

          # 4. Ensure settings.gradle.kts includes ':app'
          if [ ! -f "settings.gradle.kts" ]; then
            echo "include(':app')" > settings.gradle.kts
          elif ! grep -q "include" settings.gradle.kts; then
            echo "include(':app')" >> settings.gradle.kts
          fi

          # 5. Create minimal root build.gradle.kts if missing (EOF left-aligned at column 0)
          if ! grep -q "plugins" build.gradle.kts 2>/dev/null; then
            cat << 'EOF' > build.gradle.kts
plugins {
    id("com.android.application") version "8.2.0" apply false
    id("org.jetbrains.kotlin.android") version "1.9.0" apply false
}
EOF
          fi

          # 6. Set SDK location
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
