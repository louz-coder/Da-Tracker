name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find and Build Project
        run: |
          # Automatically find where gradlew is located and enter that directory
          PROJECT_DIR=$(dirname $(find . -name "gradlew" -print -quit))
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
