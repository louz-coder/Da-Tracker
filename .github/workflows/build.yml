name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip File
        run: |
          unzip -o *.zip -d extracted_app
          # Move subfolder contents up if zip extracted as a single main folder
          if [ -d "extracted_app/DATracker_Android_Project" ]; then
            mv extracted_app/DATracker_Android_Project/* extracted_app/
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew
        working-directory: ./extracted_app

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./extracted_app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-Tracker-APK
          path: extracted_app/app/build/outputs/apk/debug/app-debug.apk
